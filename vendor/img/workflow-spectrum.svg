<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 230" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="The workflow to agent spectrum">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c9bff"/>
      <stop offset="1" stop-color="#5eead8"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="858" height="228" rx="16" fill="#0f1620" stroke="#243042"/>
  <text x="28" y="40" fill="#e6edf5" font-size="19" font-weight="700">Workflow to agent: a spectrum, not a switch</text>

  <rect x="60" y="100" width="740" height="8" rx="4" fill="url(#grad)"/>
  <circle cx="60" cy="104" r="9" fill="#7c9bff"/>
  <circle cx="800" cy="104" r="9" fill="#5eead8"/>

  <text x="60" y="150" fill="#7c9bff" font-size="15" font-weight="700">Workflow</text>
  <text x="60" y="172" fill="#9fb0c0" font-size="12.5">You write the steps.</text>
  <text x="60" y="190" fill="#9fb0c0" font-size="12.5">The model fills the blanks.</text>
  <text x="60" y="212" fill="#6b7888" font-size="12">Predictable</text>

  <text x="800" y="150" fill="#5eead8" font-size="15" font-weight="700" text-anchor="end">Agent</text>
  <text x="800" y="172" fill="#9fb0c0" font-size="12.5" text-anchor="end">The model decides</text>
  <text x="800" y="190" fill="#9fb0c0" font-size="12.5" text-anchor="end">the steps at runtime.</text>
  <text x="800" y="212" fill="#6b7888" font-size="12" text-anchor="end">Flexible, harder to control</text>

  <text x="430" y="78" fill="#8b97a7" font-size="12.5" text-anchor="middle">Most production "agents" sit here</text>
  <path d="M430 82 L430 96" stroke="#8b97a7" stroke-width="1.5"/>
  <circle cx="430" cy="104" r="7" fill="#0f1620" stroke="#cbd5e1" stroke-width="2"/>
</svg>
