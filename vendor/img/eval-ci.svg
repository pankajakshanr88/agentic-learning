<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Evals as a CI gate">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7c9bff"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="858" height="248" rx="16" fill="#0f1620" stroke="#243042"/>
  <text x="28" y="40" fill="#e6edf5" font-size="19" font-weight="700">Evals as a CI gate</text>
  <text x="28" y="62" fill="#8b97a7" font-size="13">Same shape as your test suite. The assertion is "good enough," not "equal."</text>

  <rect x="28" y="105" width="150" height="64" rx="10" fill="#161c25" stroke="#2f3a49"/>
  <text x="103" y="142" fill="#e6edf5" font-size="14" text-anchor="middle">Prompt change</text>

  <rect x="230" y="105" width="170" height="64" rx="10" fill="#13202b" stroke="#2c5c57"/>
  <text x="315" y="135" fill="#5eead8" font-size="14" font-weight="700" text-anchor="middle">Eval suite</text>
  <text x="315" y="156" fill="#9fb0c0" font-size="12" text-anchor="middle">score the test set</text>

  <path d="M452 137 l28 -18 28 18 -28 18 z" fill="#1a2230" stroke="#3a4a59"/>
  <text x="480" y="142" fill="#cbd5e1" font-size="12" text-anchor="middle">pass?</text>

  <rect x="560" y="60" width="270" height="58" rx="10" fill="#13251c" stroke="#2f6b46"/>
  <text x="695" y="94" fill="#7ee0a6" font-size="14" font-weight="700" text-anchor="middle">≥ threshold → ship</text>

  <rect x="560" y="150" width="270" height="58" rx="10" fill="#2a1618" stroke="#7a3236"/>
  <text x="695" y="184" fill="#ff9aa0" font-size="14" font-weight="700" text-anchor="middle">below → exit 1, block deploy</text>

  <line x1="178" y1="137" x2="226" y2="137" stroke="#7c9bff" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="400" y1="137" x2="450" y2="137" stroke="#7c9bff" stroke-width="2" marker-end="url(#a2)"/>
  <path d="M508 128 C 540 110, 540 92, 556 89" fill="none" stroke="#7c9bff" stroke-width="2" marker-end="url(#a2)"/>
  <path d="M508 146 C 540 165, 540 178, 556 179" fill="none" stroke="#7c9bff" stroke-width="2" marker-end="url(#a2)"/>
</svg>
